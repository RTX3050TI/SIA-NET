<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-label="Paleta de colores de SIA-Net" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="760" height="230" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="380" y="30" text-anchor="middle" font-family="system-ui,Arial" font-size="16" font-weight="700" fill="#1e3a8a">Paleta de colores de SIA-Net</text>
<g font-family="system-ui,Arial" font-size="10.5" text-anchor="middle" fill="#0f172a">
<g opacity="0"><animate attributeName="opacity" to="1" dur=".5s" begin="0s" fill="freeze"/><rect x="20" y="55" width="80" height="80" rx="10" fill="#0f172a"/><text x="60" y="155">Sidebar</text><text x="60" y="170" fill="#64748b">#0f172a</text></g>
<g opacity="0"><animate attributeName="opacity" to="1" dur=".5s" begin=".3s" fill="freeze"/><rect x="110" y="55" width="80" height="80" rx="10" fill="#1e3a8a"/><text x="150" y="155">Azul corporativo</text><text x="150" y="170" fill="#64748b">#1e3a8a</text></g>
<g opacity="0"><animate attributeName="opacity" to="1" dur=".5s" begin=".6s" fill="freeze"/><rect x="200" y="55" width="80" height="80" rx="10" fill="#2749b5"/><text x="240" y="155">Azul hover</text><text x="240" y="170" fill="#64748b">#2749b5</text></g>
<g opacity="0"><animate attributeName="opacity" to="1" dur=".5s" begin=".9s" fill="freeze"/><rect x="290" y="55" width="80" height="80" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/><text x="330" y="155">Fondo</text><text x="330" y="170" fill="#64748b">#f8fafc</text></g>
<g opacity="0"><animate attributeName="opacity" to="1" dur=".5s" begin="1.2s" fill="freeze"/><rect x="380" y="55" width="80" height="80" rx="10" fill="#e2e8f0"/><text x="420" y="155">Bordes</text><text x="420" y="170" fill="#64748b">#e2e8f0</text></g>
<g opacity="0"><animate attributeName="opacity" to="1" dur=".5s" begin="1.5s" fill="freeze"/><rect x="470" y="55" width="80" height="80" rx="10" fill="#dcfce7"/><circle cx="510" cy="95" r="14" fill="#166534"/><text x="510" y="155">Favorable</text><text x="510" y="170" fill="#64748b">#dcfce7 / #166534</text></g>
<g opacity="0"><animate attributeName="opacity" to="1" dur=".5s" begin="1.8s" fill="freeze"/><rect x="560" y="55" width="80" height="80" rx="10" fill="#fef9c3"/><circle cx="600" cy="95" r="14" fill="#854d0e"/><text x="600" y="155">Pendiente</text><text x="600" y="170" fill="#64748b">#fef9c3 / #854d0e</text></g>
<g opacity="0"><animate attributeName="opacity" to="1" dur=".5s" begin="2.1s" fill="freeze"/><rect x="650" y="55" width="80" height="80" rx="10" fill="#fee2e2"/><circle cx="690" cy="95" r="14" fill="#991b1b"/><text x="690" y="155">Alerta</text><text x="690" y="170" fill="#64748b">#fee2e2 / #991b1b</text></g>
</g>
<circle cx="150" cy="95" r="10" fill="none" stroke="#fff" stroke-width="2"><animate attributeName="r" values="10;32;10" dur="2.4s" begin="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0;.9" dur="2.4s" begin="2.6s" repeatCount="indefinite"/></circle>
<text x="380" y="210" text-anchor="middle" font-family="system-ui,Arial" font-size="11" fill="#64748b">Propuesta visual del prototipo; no son los colores oficiales de la institución.</text>
</svg>
