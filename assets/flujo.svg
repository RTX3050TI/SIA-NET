<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" role="img" aria-label="Flujo de datos: navegador, servidor API y base de datos" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="800" height="260" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
<g font-family="system-ui,Arial" text-anchor="middle">
<text x="400" y="30" font-size="16" font-weight="700" fill="#1e3a8a">Flujo de datos con servidor (fase futura)</text>
<rect x="30" y="85" width="170" height="100" rx="12" fill="#1e3a8a"/><text x="115" y="125" font-size="15" font-weight="700" fill="#fff">Navegador (SPA)</text><text x="115" y="148" font-size="11" fill="#bfdbfe">HTML · CSS · JavaScript</text>
<rect x="315" y="85" width="170" height="100" rx="12" fill="#0f172a"/><text x="400" y="118" font-size="15" font-weight="700" fill="#fff">Servidor API</text><text x="400" y="140" font-size="11" fill="#cbd5e1">Login · Permisos (RBAC)</text><text x="400" y="157" font-size="11" fill="#cbd5e1">Validación · Auditoría</text>
<rect x="600" y="85" width="170" height="100" rx="12" fill="#166534"/><text x="685" y="125" font-size="15" font-weight="700" fill="#fff">Base de datos</text><text x="685" y="148" font-size="11" fill="#dcfce7">PostgreSQL</text>
<text x="257" y="95" font-size="11" fill="#64748b">HTTPS · JSON</text><text x="542" y="95" font-size="11" fill="#64748b">SQL</text>
</g>
<g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4"><line x1="200" y1="115" x2="315" y2="115"/><line x1="200" y1="155" x2="315" y2="155"/><line x1="485" y1="115" x2="600" y2="115"/><line x1="485" y1="155" x2="600" y2="155"/></g>
<circle r="6" fill="#2749b5"><animateMotion path="M200,115 L315,115" dur="1.6s" repeatCount="indefinite"/></circle>
<circle r="6" fill="#2749b5"><animateMotion path="M485,115 L600,115" dur="1.6s" begin=".8s" repeatCount="indefinite"/></circle>
<circle r="6" fill="#16a34a"><animateMotion path="M600,155 L485,155" dur="1.6s" begin="1.6s" repeatCount="indefinite"/></circle>
<circle r="6" fill="#16a34a"><animateMotion path="M315,155 L200,155" dur="1.6s" begin="2.4s" repeatCount="indefinite"/></circle>
<g font-family="system-ui,Arial" font-size="12" fill="#64748b" text-anchor="middle"><circle cx="300" cy="228" r="6" fill="#2749b5"/><text x="400" y="232" text-anchor="start" x2="0">Petición</text><circle cx="470" cy="228" r="6" fill="#16a34a"/><text x="482" y="232" text-anchor="start">Respuesta</text></g>
</svg>
